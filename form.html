    <form action="mailto:chinazaekperechukwu47@gmail.com" method="post">
        <fieldset class="sign3">
      <fieldset class="sign">
        <legend >Sign Up</legend><br> 
        <label for="Text"> Name:</label>
        <input type="text" id="Text" name="name" placeholder="Full Name" required class="text"/><br />
        <br />
        <label for="Email"> Email: </label>
        <input type="email" id="Email" name="email" placeholder="E-mail" required class="mail"/><br />
        <br />
        <label for="date"> Date: </label>
        <input type="date" id="date" name="date" required><br> <br>
        <label for="space"> Type of Space: </label><br> <br>
        <input type="checkbox" name="space" value="living-room">
        Living Room
        <input type="checkbox" name="space" value="outdoor">
        Outdoor
        <input type="checkbox" name="space" value="office">
        Office
        <input type="checkbox" name="space" value="guest-room">
        Guest Room
        <input type="checkbox" name="space" value="kids-room">
        Kid's Room
        <input type="checkbox" name="space" value="walk-in-closet">
        Walk-in Closet
        <input type="checkbox" name="space" value="kitchen">
        Kitchen
      </fieldset>
      <fieldset class="sign2">  
        <legend> Message </legend>
        <label for="message"></label> 
        <textarea id="message" name="message" rows="7" cols="70" placeholder="What do you want"></textarea> <br> 
      </fieldset> <br>
       <button type="submit">Submit</button>
      </fieldset>
        
    </form>
